pluginGroup=com.github.catppuccin.jetbrains_icons
pluginName=Catppuccin Icons
pluginVersion=1.13.3
pluginSinceBuild=231
pluginUntilBuild=263.*
platformType=IC
platformVersion=2023.1
platformPlugins=org.jetbrains.kotlin,com.intellij.java
javaVersion=17
kotlin.stdlib.default.dependency=false
buildSearchableOptions.enabled=false

# The generated Icons.kt declares one property per icon (~2600 of them), so compiling the plugin
# against the IntelliJ Platform exhausts the default 1 GB Gradle heap and the Kotlin daemon.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx3g
